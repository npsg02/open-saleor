version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - saleor-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=saleor
      - POSTGRES_PASSWORD=saleor
      - POSTGRES_DB=saleor
    ports:
      - "5432:5432"
    networks:
      - saleor-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - saleor-redis:/data
    networks:
      - saleor-network

  api:
    image: ghcr.io/saleor/saleor:3.19
    restart: unless-stopped
    depends_on:
      - db
      - redis
    volumes:
      - ./saleor/media:/app/media
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://saleor:saleor@db:5432/saleor
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SECRET_KEY=changeme
      - ALLOWED_HOSTS=localhost,127.0.0.1,api
      - DEFAULT_FROM_EMAIL=noreply@example.com
    ports:
      - "8000:8000"
    networks:
      - saleor-network
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn --bind 0.0.0.0:8000 --workers 4 --worker-class saleor.asgi.gunicorn_worker.UvicornWorker saleor.asgi:application
      "

  worker:
    image: ghcr.io/saleor/saleor:3.19
    restart: unless-stopped
    depends_on:
      - redis
      - db
    volumes:
      - ./saleor/media:/app/media
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://saleor:saleor@db:5432/saleor
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SECRET_KEY=changeme
    networks:
      - saleor-network
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info

  dashboard:
    image: ghcr.io/saleor/saleor-dashboard:3.19
    restart: unless-stopped
    ports:
      - "9000:80"
    networks:
      - saleor-network
    environment:
      - API_URL=http://localhost:8000/graphql/

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - saleor-network

volumes:
  saleor-db:
  saleor-redis:

networks:
  saleor-network:
    driver: bridge
